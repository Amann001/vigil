name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres with pgvector, so the queue, memory and checkpoint code is tested
    # against a real database.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VIGIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned: the same uv as development, and no "latest version" lookup, which twice
          # failed with HTTP 504 from GitHub before any test ran.
          version: "0.11.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

      # The built site in a real Chrome (preinstalled on the runner), against the replay.
      - name: Browser tests
        run: npm run test:e2e
        env:
          CHROME_PATH: /usr/bin/google-chrome

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigil:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm vigil:ci --help
          docker run --rm --entrypoint python vigil:ci -c "import vigil.api, vigil.worker, vigil.watch, onnxruntime; print('imports ok')"
          docker run --rm --entrypoint python vigil:ci -c "import importlib.util as u; assert u.find_spec('torch') is None; print('no PyTorch in the runtime image')"
          docker run -d --name api -p 8030:8030 vigil:ci api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8030/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8030/health
          docker rm -f api
          docker image ls vigil:ci

  # The whole system in one container, as the public live demo runs it: build it, start it,
  # and check that the shop is up, Prometheus is scraped, the watcher is reading it and the war
  # room is served. No model keys or database here, so no investigation runs.
  space:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/space/Dockerfile
          load: true
          tags: vigil-space:ci
          cache-from: type=gha,scope=space
          cache-to: type=gha,mode=max,scope=space

      - name: Start it and check every part
        run: |
          docker run -d --name space -p 8030:8030 vigil-space:ci
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8030/health && break; sleep 2; done
          curl -sf http://127.0.0.1:8030/health
          # The shop and Prometheus: the system view goes online once metrics arrive.
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8030/system | grep -q '"online":true' && break; sleep 3
          done
          curl -sf http://127.0.0.1:8030/system | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['online'], s; print('services:', sorted(s['services']))"
          # The war room, at one of its page addresses.
          curl -sf http://127.0.0.1:8030/war-room | grep -q '<div id="root">'
          curl -sf http://127.0.0.1:8030/config | python3 -c "import json,sys; print('actions:', [a['name'] for a in json.load(sys.stdin)['actions']])"
          docker logs space 2>&1 | grep -q "Watching" && echo "watcher running"
          docker logs space 2>&1 | tail -30
          docker rm -f space
