name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # A throwaway Postgres with pgvector, so the queue, memory and checkpoint code is tested
    # against a real database.
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      VIGIL_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          # Pinned: the same uv as development, and no "latest version" lookup, which twice
          # failed with HTTP 504 from GitHub before any test ran.
          version: "0.11.19"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vigil:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run --rm vigil:ci --help
          docker run --rm --entrypoint python vigil:ci -c "import vigil.api, vigil.worker, vigil.watch, onnxruntime; print('imports ok')"
          docker run --rm --entrypoint python vigil:ci -c "import importlib.util as u; assert u.find_spec('torch') is None; print('no PyTorch in the runtime image')"
          docker run -d --name api -p 8030:8030 vigil:ci api
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8030/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8030/health
          docker rm -f api
          docker image ls vigil:ci
