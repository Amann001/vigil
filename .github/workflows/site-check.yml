name: Site check

# Every day, the public site (https://vigil-aman.vercel.app) is opened in a real Chrome and
# put through the same browser tests as every change: every page, the stars, the film, the
# palette, the replay to an approved fix, phones, and a browser with 3D switched off.
# A failure emails the repository owner. Run it by hand from the Actions tab too.
on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC daily, off the hour when GitHub's runners are busiest
  workflow_dispatch:

jobs:
  production:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Browser tests against the public site
        run: npm run test:e2e
        env:
          SITE_URL: https://vigil-aman.vercel.app
          CHROME_PATH: /usr/bin/google-chrome
