[project]
name = "vigil"
version = "0.1.0"
description = "Multi-agent AI on-call engineer: detects, diagnoses and fixes production incidents with a human in the loop."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Amann001", email = "swamyaman3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "drain3>=0.9.11",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "onnxruntime>=1.31.1",
    "pandas>=3.1.0",
    "prometheus-client>=0.26.0",
    "psutil>=7.2.2",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[project.urls]
Repository = "https://github.com/Amann001/vigil"

[project.scripts]
vigil = "vigil:main"

[build-system]
requires = ["uv_build>=0.11.19,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# `vigil` is the product; `shop` is the demo system that Vigil monitors.
module-name = ["vigil", "shop"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
# Only needed to train the LSTM autoencoder (installed by default so tests and benchmarks run).
# Vigil itself runs the exported model with onnxruntime: `uv sync --no-group train` saves ~0.6 GB.
train = [
    "onnx>=1.23.2",
    "torch>=2.15.0",
]

[tool.uv]
default-groups = ["dev", "train"]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

# CPU-only PyTorch on every platform. The default Linux build pulls in several GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
